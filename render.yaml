services:
  - type: web
    name: zella-hostel-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PROJECT_NAME
        value: "Zella Hostel Management System"
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://zella-hostel-gw76.vercel.app,http://localhost:5173,http://127.0.0.1:5173"
